# All model access goes through hfal/ask.py::call_model. Switch provider here (see README, "Model providers").
model:
  provider: anthropic          # anthropic | bedrock
  name: claude-sonnet-5-5      # Anthropic API model name (used when provider: anthropic)
  # Used when provider: bedrock. Copy the model / inference profile ID from the Bedrock console
  # (Model catalog); newer models need a regional ID such as us.anthropic.<model>.
  bedrock_id: "us.anthropic.claude-sonnet-4-6"
  aws_region: us-east-1
  aws_profile: hackathon       # optional: a named profile (e.g. an SSO profile). Otherwise env vars:
                               # AWS_BEARER_TOKEN_BEDROCK, or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
  temperature: null            # not sent unless set: the SDK has no temperature argument (sent via extra_body if set;
                               # the API may reject it for some models). Reproducibility = response cache + logged ids.
  # Thinking tokens count toward max_output_tokens, so leave room. v5 used about 8K; the first v7 call (Nov 12) hit
  # 16K, so 32K. Calls above about 21K have to stream (the SDK's rule); ask.py streams every Claude call.
  max_output_tokens: 32000
  # How hard the model thinks (low | medium | high | xhigh | max). high is claude-sonnet-5-5's own default, written
  # out so it is logged and part of the cache key. Accuracy beats cost here; try medium on dev only with evidence.
  effort: high

# The judge (`hfal judge`): a second model that explains disagreements with the golden labels. It is a different,
# stronger model than the checker on purpose, so the two do not share blind spots. Same provider rules as `model`.
judge:
  provider: anthropic
  name: claude-opus-5-5
  bedrock_id: "<set from the Bedrock console>"
  aws_region: us-east-1
  aws_profile: null
  temperature: null
  max_output_tokens: 16000
  effort: high

# Model presets, for comparing models without editing the sections above: `hfal ask --model NAME`, `hfal ping --model
# NAME` and `hfal judge --model NAME` use models.NAME in place of `model:` (ask, ping) or `judge:` (judge) for that one
# command. Each run records its provider and model, and its run_id names them.
#   openweight a non-Claude (open-weight) model on Amazon Bedrock through InvokeModel (ask.py). bedrock_id is the
#              inference profile ID. Only us.* profiles work for this account's role (global.* is denied; Nov 12).
# Kimi on Bedrock (tested Nov 12): through the Converse API the JSON-schema reply format was not enforced on
# hospital-sized prompts (fields renamed or dropped, JSON in a code fence: 5 of 5 real replies). Through InvokeModel
# with response_format strict it was (largest test hospital, both models), so ask.py uses InvokeModel. Every reply is
# still checked in code, with one retry; nothing broken is used. `effort` is sent as reasoning_effort (the model
# card's field; Kimi's default is max). 1M-token context window on both model cards. Bedrock's kimi-k3.1 is "K3.1 Pro Highspeed".
# Rate limits could not be read (the role may not list quotas). Kimi's reasoning counts as output: 8-17K tokens per
# hospital at high, 24-30K at max (K3 at max used 29.6K on a mid-sized hospital, Nov 12), so the Kimi presets allow
# 64K: twice the most seen, half the 128K that third-party listings give for K3 on Bedrock (AWS's own card not
# checked). Not part of the cache key, so cached answers stay valid. A hospital that still hits it is recorded in
# runs/RUN_ID/failed.json and the batch carries on (ask.py iter_ask).
models:
  sonnet-5-5:
    provider: anthropic
    name: claude-sonnet-5-5
    temperature: null
    max_output_tokens: 32000
    effort: high
  opus-5-5:
    provider: anthropic
    name: claude-opus-5-5
    temperature: null
    max_output_tokens: 32000
    effort: high
  kimi-k3:
    provider: openweight
    context_window_tokens: 1000000   # same as claude-sonnet-5-5 (owner, Nov 12)
    bedrock_id: us.moonshotai.kimi-k3
    aws_region: us-east-1
    aws_profile: hackathon
    temperature: null
    max_output_tokens: 64000
    effort: high
  kimi-k3.1:
    provider: openweight
    context_window_tokens: 1000000   # same as claude-sonnet-5-5 (owner, Nov 12)
    bedrock_id: us.moonshotai.kimi-k3.1
    aws_region: us-east-1
    aws_profile: hackathon
    temperature: null
    max_output_tokens: 64000
    effort: high
  kimi-k3-max:                 # Kimi's own default thinking level (see kimi-k3.1-max)
    provider: openweight
    context_window_tokens: 1000000   # same as claude-sonnet-5-5 (owner, Nov 12)
    bedrock_id: us.moonshotai.kimi-k3
    aws_region: us-east-1
    aws_profile: hackathon
    temperature: null
    max_output_tokens: 64000    # K3 at max wrote 29.6K on one hospital (Nov 12); a capped reply fails, still billed
    effort: max
  # Kimi's own default thinking level. At high, K3.1 wrote half the tokens and copied 2 of 17 quotes word for word on
  # one test hospital; its earlier replies at max copied 43-73% (Nov 12). The run_id does not name the effort; the
  # run's call info and the ledger do.
  kimi-k3.1-max:
    provider: openweight
    context_window_tokens: 1000000   # same as claude-sonnet-5-5 (owner, Nov 12)
    bedrock_id: us.moonshotai.kimi-k3.1
    aws_region: us-east-1
    aws_profile: hackathon
    temperature: null
    max_output_tokens: 64000    # K3 at max wrote 29.6K on one hospital (Nov 12); a capped reply fails, still billed
    effort: max

# Prices in US dollars per million tokens, for the cost in the usage summary and ledger (src/hfal/usage.py). Anthropic
# API list prices (Nov 2026; check https://www.anthropic.com/pricing when they change). A model not listed here is
# counted in tokens with its cost left blank. Amazon Bedrock is priced separately: add a key "<provider>/<bedrock_id>"
# (provider bedrock or openweight).
# Prompt caching (Nov 12, on for every model unless a model section or preset says `prompt_cache: false`): the system
# prompt, the same for every hospital, is cached by the provider and read back on later calls. cache_read is the price
# of an input token read from the cache, cache_write of one written to it. Claude uses the one-hour cache: write = 2x
# input, read = 0.05x (Sonnet 5.5 $0.10, Opus 5.5 $0.20). Kimi: the Bedrock model cards' "Cache read" and "Cache write
# (30 min)" columns, US CRIS. A call that used the cache on a model with no cache price has its cost left blank.
# Kimi: us-east-1 on-demand prices of the us.* profiles. K3 from AWS's model card (Nov 12). K3.1: the Bedrock model
# card "Kimi K3.1 Pro - Highspeed", US CRIS (Nov 12).
prices:
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 4.00}
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 8.00}
  openweight/us.moonshotai.kimi-k3: {input: 3.30, output: 16.50, cache_read: 0.33, cache_write: 4.125}
  openweight/us.moonshotai.kimi-k3.1: {input: 4.40, output: 22.00, cache_read: 0.22, cache_write: 5.50}

# v5 (criteria_overrides.yaml -> criteria.yaml): the rubric (checks, notes and reading rules), the reported lists
# (languages, PSA counties), the 2007 PSA rule, the state's blank uniform application in the system prompt
# (<reference_form>) and the checks below. Run on 20 dev hospitals. Earlier versions (v1-v4) are retired.
# v6 (criteria_overrides_v6.yaml): PSA from wording about residents, languages NO when none named, physician-group
# documents set aside. Folded into v7; not run on its own.
# v7 (criteria_overrides_v7.yaml -> criteria_v7.yaml): v6 plus consistency point by point (src/hfal/consistency.py).
# Set prompt_version and criteria_file together; once a version has been run, bump it with every wording change.
# Decided Nov 11 (owner): no v5 baseline on the other 60 dev hospitals and no v6 run; the next paid run is v7.
# v5 stays on disk for the 20 dev hospitals already asked. To judge or re-ask those v5 runs, set both lines back
# (prompt_version: v5 and criteria_file: criteria.yaml).
prompt_version: v7
criteria_file: criteria_v7.yaml

# "Too large for one call". A hospital whose prompt (all its documents, the criteria and the instructions) would
# use more than max_input_share of the model's context window is NOT asked and NOT truncated: `hfal ask` skips it,
# lists it in runs/RUN_ID/skipped.json, and attrition counts it as "too large for one call". The rest of the
# batch carries on.
#   context_window_tokens  claude-sonnet-5-5 has a 1,000,000-token window (Anthropic's model table, Nov 2026).
#                          This is the default. A model section or a preset under `models:` can set its own
#                          context_window_tokens, which wins for that model (the judge uses the `judge` section's).
#                          Every non-Claude preset must set it: its window is not Claude's. Check the Models API field
#                          max_input_tokens, or the Bedrock console for Bedrock models.
#   max_input_share        0.80 leaves room for the answer (up to max_output_tokens) and for token-count error.
#   chars_per_token        2.3, measured on real prompts (Nov 10: the 10-hospital sample's billed input tokens).
#                          It was 3 until Nov 12, which counted about a quarter too few tokens. Tables, numbers and
#                          forms use more tokens per character than prose, and other models' tokenizers may differ.
# This is a safety limit, not a quality limit: research finds accuracy can fall long before the window is full
# (PLAN.md, "Long-context checks"). Quality is measured with the prompt-size analysis, not assumed.
context_window_tokens: 1000000
max_input_share: 0.80
chars_per_token: 2.3

# OCR for scanned PDFs (src/hfal/ocr.py), run by `hfal extract` (and so by `hfal monitor`). Only pages with almost no
# text of their own, in PDFs flagged needs_ocr, are sent to Amazon Textract (DetectDocumentText, one page per call,
# no S3). Replies are cached in data/cache/ocr/, so a page is billed once; each billed page is a ledger row.
#   enabled         false: scanned documents keep needs_ocr and their hospitals stay excluded, as before (Nov 12).
#                   Switching it off also redoes already OCR'd files without OCR.
#   aws_profile     a named profile (e.g. SSO; sign in with `aws sso login --profile NAME`), or null for env vars.
#                   The role needs textract:DetectDocumentText.
#   dpi             resolution each page is drawn at before it is sent (lower automatically if over 10 MB).
#   price_per_page  US dollars, for the ledger: $1.50 per 1,000 pages (us-east-1 list price, first million pages a
#                   month; check https://aws.amazon.com/textract/pricing/).
ocr:
  enabled: true
  aws_region: us-east-1
  aws_profile: hackathon
  dpi: 300
  price_per_page: 0.0015

fetch:
  delay_seconds: 1.5
  timeout_seconds: 30
  # false since Nov 12 (owner's decision): robots.txt is still read, but a disallowed page or document is fetched
  # anyway and marked robots_disallowed in the manifest, so attrition and `hfal report` say which ones. Bot checks
  # (401/403/429) are still not worked around. true: a disallowed URL is not fetched and excludes the hospital.
  respect_robots: false
  # Since Nov 14 (owner's decision): a headless Chromium (Playwright, src/hfal/browser.py) retries what plain HTTP
  # could not read: a blocked or failed download, a landing page with no links (built by JavaScript), and, in
  # discovery, a crawl that found no PDF or Word document. Its user agent is the browser's own ("HeadlessChrome")
  # plus ours; it never solves a CAPTCHA (that hospital stays excluded as a bot check). What it collects is marked
  # fetched_with_browser / browser and reported. false: plain HTTP only, as before Nov 14.
  # One-time setup: uv run playwright install chromium
  browser_fallback: true
  browser_settle_ms: 5000     # after the page loads, wait up to this long for its scripts to finish loading

# The form check (src/hfal/formcheck.py), for the criterion entire_uniform_application. Code measures how much of
# the state form's wording a hospital document contains (4-word windows; the poverty table's figures are ignored).
#   pass_share            at or above this share, with no paragraph mostly missing, the answer is YES by code.
#   min_paragraph_share   a paragraph of the state form (12+ words) found less than this much in the document counts
#                         as missing, and the document does not pass however high the overall share is.
# Below the pass line a model YES becomes UNCLEAR; a model NO or UNCLEAR stands. Only used when the criteria file
# names a reference_form.
form_check:
  pass_share: 0.98
  min_paragraph_share: 0.5

# The FPL check (src/hfal/fpl.py), for the criterion 2025_fpl_guidelines. Code compares the dollar amounts in the
# application (the document that best matches the state form) with the official poverty figures of each year in
# config/reference/fpl.yaml. Figures of 2025 or later only: YES by code; earlier years only: NO; both: UNCLEAR;
# none recognised: the model's answer stands. Same on/off switch as form_check (needs a reference form).
#   min_figures   a year counts as found when at least this many of its 32 amounts (100/200/300/400% for 1-8 people) appear.
fpl_check:
  min_figures: 6

# The max FPL check (src/hfal/maxfpl.py), for the criterion max_fpl. Code looks in the application (same document as
# above) for a clear statement that assistance reaches 400% ("up to 400% ... eligible"). A model NO against such a
# statement becomes UNCLEAR; nothing else changes (code never creates a YES). Same on/off switch as form_check.
max_fpl_check: true
